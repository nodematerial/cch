name: test

on:
  push:
  pull_request:

# Tests only read the repository; no write access is needed
permissions:
  contents: read

jobs:
  # Lint once; the result does not depend on the OS
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than a tag, which can be moved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          shellcheck cch
          shellcheck -s bash test/test_helper.bash

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install fzf jq ripgrep bats-core
      - run: bats test/

  # Linux distributions, each with the packages its users would get, including their fzf
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # fzf 0.44 and 0.38: cch runs without ctrl-t
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y fzf jq ripgrep bats perl uuid-runtime
          - image: debian:bookworm
            install: apt-get update && apt-get install -y fzf jq ripgrep bats perl uuid-runtime
          # fzf 0.58 or later: every feature
          - image: debian:trixie
            install: apt-get update && apt-get install -y fzf jq ripgrep bats perl uuid-runtime
          - image: fedora:latest
            install: dnf install -y fzf jq ripgrep bats perl findutils gawk util-linux
          - image: archlinux:latest
            install: pacman -Syu --noconfirm fzf jq ripgrep bats perl util-linux
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          ${{ matrix.install }}
          fzf --version
      - run: bats test/
